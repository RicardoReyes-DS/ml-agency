<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#171717;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(59, 130, 246, 0.1)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="3" fill="#3b82f6"/>
  <circle cx="1100" cy="100" r="2" fill="#8b5cf6"/>
  <circle cx="100" cy="530" r="2" fill="#8b5cf6"/>
  <circle cx="1100" cy="530" r="3" fill="#3b82f6"/>

  <!-- Main content -->
  <text x="600" y="280" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="48" font-weight="bold">
    Enkisys
  </text>

  <text x="600" y="340" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Inter, sans-serif" font-size="24">
    Enterprise AI Solutions & Machine Learning
  </text>

  <!-- Accent line -->
  <line x1="400" y1="380" x2="800" y2="380" stroke="url(#accent)" stroke-width="3"/>
</svg>
